# Publishes server.json to the Official MCP Registry on each version tag.
# Authenticates via DNS proof of trychannel3.com ownership (com.trychannel3/*
# namespace). The Ed25519 private key lives in the MCP_REGISTRY_PRIVATE_KEY
# secret; the matching public key is a DNS TXT record on trychannel3.com.

name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Set version from tag
        if: github.event_name == 'push'
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Authenticate to MCP Registry (DNS)
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain trychannel3.com --private-key "$MCP_REGISTRY_PRIVATE_KEY"

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
