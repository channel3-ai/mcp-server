# Security floors. Kept here (not package.json "pnpm.overrides") because pnpm 11
# no longer reads the package.json "pnpm" field and Renovate regenerates the
# lockfile with pnpm 11, which silently dropped the overrides block.
overrides:
  "@hono/node-server": ">=1.19.10"
  undici: ">=7.24.0"
  picomatch: ">=4.0.4"
  fast-xml-parser: ">=4.5.5"
  tar: ">=7.5.11"
  tar-fs: ">=2.1.4"
  flatted: ">=3.4.2"
  rollup: ">=4.59.0"
  defu: ">=6.1.5"
  devalue: ">=5.6.2"
  glob: ">=10.5.0"
  jws: ">=3.2.3"
  underscore: ">=1.13.8"
  qs: ">=6.14.2"
  preact: ">=10.27.3"
